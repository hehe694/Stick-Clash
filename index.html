<head>

    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 12px 10px;
      background: #121212;
      color: #fff;

    /* 🔝 TOP HEADER BAR */

      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 800px;
      margin-bottom: 10px;
      gap: 10px;

      border: 3px solid #fff;
      border-radius: 12px;

      font-weight: bold;
      font-size: 18px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .shop-item {

      flex-direction: column;
      width: 100%;
      max-width: 440px;
      background: #2a2a35;
      border: 2px solid #444;
      border-radius: 12px;

      gap: 8px;

    .shop-select {

      color: #ffd700;
      border: 2px solid #ffd700;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      width: 100%;

    .item-info {

      display: flex;
      flex-direction: column;
      color: #ddd;
      font-weight: 600;
      gap: 2px;

      padding: 10px;

      max-width: 800px;

      gap: 8px;

      color: #fff;

      font-size: 20px;

      font-weight: bold;

      align-items: center;

      display: none;
      margin-top: 14px;

  <script>
    // 🎵 AUDIO SYSTEM (WEB AUDIO API)
    let audioCtx = null;
    let bgmInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      startBgm();
    }

    // Soft, low-volume ambient BGM loop
    function startBgm() {
      if (bgmInterval) return;
      const notes = [220, 261.63, 329.63, 392.00]; // Chill A minor arpeggio
      let step = 0;
      
      bgmInterval = setInterval(() => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
        
        // Very quiet volume so it's not too loud
        gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
        
        step++;
      }, 1400);
    }

    function playJumpSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playAttackSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(110, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playCoinSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.07);
      gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function playBuySound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let wave = 1;
    let coins = 0;
    const MAX_COINS = 500000; // 🏦 MAX MONEY CAP $500,000
    let isShopOpen = false;
    let isAdminOpen = false;

    // 🗡️ WEAPONS LIST
    const weaponList = [
      { id: 0, name: "🪵 Wooden Club", cost: 0, dmg: 13, color: "#8B4513", mult: 1.0, passive: "Tough Bark (+10 Max HP)" },
      { id: 1, name: "🗡️ Iron Sword", cost: 100, dmg: 26, color: "#c0c0c0", mult: 1.2, passive: "Iron Defense (-1 incoming damage)" },
      { id: 2, name: "⚔️ Golden Katana", cost: 300, dmg: 45, color: "#ffd700", mult: 1.5, passive: "Lightweight (+ High Jump & Speed)" },

    // ✨ ABILITIES
    const abilityList = [
      { id: 0, name: "💥 Dash Strike", cost: 0, cd: 180, desc: "Dash forward & hit for +25 Dmg" },

      { id: 9, name: "🌟 SIGMA BEAM", cost: 8500, cd: 360, desc: "Giant Laser Beam dealing 700 Dmg" }
    ];

    let unlockedWeapons = [0];
    let currentWeaponIndex = 0;

    let unlockedAbilities = [0];
    let currentAbilityIndex = 0;
    let abilityCooldownTimer = 0;

    let speedLevel = 1;
    let speedCost = 100;
    
    let coinMultLevel = 1;
    let coinMultCost = 150;

    let regenTimer = 0;
    const gravity = 0.6;
    const jumpPower = -12;

    let player = { 
      x: 150, y: 280, vy: 0, hp: 100, maxHp: 100, color: '#00d2ff', 
      attacking: false, attackCooldown: 0, maxCooldown: 18, 
      facingRight: true, hurtTimer: 0, shieldTimer: 0, isJumping: false, walkCycle: 0
    };

    let enemy = { 
      x: 650, y: 280, vy: 0, hp: 40, maxHp: 40, color: '#ff4757', 
      attacking: false, attackCooldown: 0, maxCooldown: 22, 
      speed: 1.8, damage: 8, facingRight: false, hurtTimer: 0, freezeTimer: 0, slowTimer: 0, walkCycle: 0
    };
    
    let moveLeft = false;
    let moveRight = false;
    let attackBuffer = 0; 
    let hitsEffects = [];
    let activeProjectiles = [];
    let specialVisualFx = null;

    // DROPDOWNS SETUP
    const weaponSelect = document.getElementById('weaponSelect');
    const adminWeaponSelect = document.getElementById('adminWeaponSelect');
    weaponList.forEach((w, index) => {
      const opt = document.createElement('option');

    const abilitySelect = document.getElementById('abilitySelect');

    abilityList.forEach((a, index) => {

    // 🔐 ENCRYPTION HELPER (Caesar +3 -> Base64 -> Base64)
    function encryptPassword(str) {
      let caesar = "";
      for (let i = 0; i < str.length; i++) {
        let c = str[i];
        if (c >= 'a' && c <= 'z') {
          caesar += String.fromCharCode((c.charCodeAt(0) - 97 + 3) % 26 + 97);
        } else if (c >= 'A' && c <= 'Z') {
          caesar += String.fromCharCode((c.charCodeAt(0) - 65 + 3) % 26 + 65);
        } else {
          caesar += c;
        }
      }
      return btoa(btoa(caesar));
    }

    function drawStickman(stick) {
      ctx.save();
      
      if (stick === player && stick.shieldTimer > 0) {
        ctx.strokeStyle = "#00d2ff";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(stick.x, stick.y - 10, 50, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (stick === enemy && stick.freezeTimer > 0) {
        ctx.fillStyle = "rgba(116, 185, 255, 0.4)";
        ctx.fillRect(stick.x - 25, stick.y - 65, 50, 110);
      }

      ctx.strokeStyle = (stick.hurtTimer > 0) ? "#ffffff" : stick.color;
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.arc(stick.x, stick.y - 40, 15, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(stick.x, stick.y - 25);
      ctx.lineTo(stick.x, stick.y + 20);
      ctx.stroke();

      let legOffset = Math.sin(stick.walkCycle) * 12;
      ctx.beginPath();
      ctx.moveTo(stick.x, stick.y + 20);
      ctx.lineTo(stick.x - 12 + legOffset, stick.y + 50);
      ctx.moveTo(stick.x, stick.y + 20);
      ctx.lineTo(stick.x + 12 - legOffset, stick.y + 50);
      ctx.stroke();

      const shoulderX = stick.x;
      const shoulderY = stick.y - 15;

      let weaponColor = "#ffffff";
      if (stick === player) {
        weaponColor = weaponList[currentWeaponIndex].color;
      }

      if (stick.attacking) {
        let progress = 1 - (stick.attackCooldown / stick.maxCooldown);
        let startAngle, endAngle, currentAngle;

        if (stick.facingRight) {
          startAngle = -0.39 * Math.PI;
          endAngle = 0.39 * Math.PI;
          currentAngle = startAngle + (endAngle - startAngle) * progress;

          ctx.strokeStyle = stick.color;
          ctx.lineWidth = 10;
          ctx.globalAlpha = 0.6;
          ctx.beginPath();
          ctx.arc(shoulderX, shoulderY, 65, startAngle, currentAngle, false);
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        } else {
          startAngle = 1.39 * Math.PI;
          endAngle = 0.61 * Math.PI;
          currentAngle = startAngle - (startAngle - endAngle) * progress;

          ctx.strokeStyle = stick.color;
          ctx.lineWidth = 10;
          ctx.globalAlpha = 0.6;
          ctx.beginPath();
          ctx.arc(shoulderX, shoulderY, 65, startAngle, currentAngle, true);
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        }

        let handX = shoulderX + Math.cos(currentAngle) * 20;
        let handY = shoulderY + Math.sin(currentAngle) * 20;
        let tipX = shoulderX + Math.cos(currentAngle) * 65;
        let tipY = shoulderY + Math.sin(currentAngle) * 65;

        ctx.strokeStyle = stick.color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(shoulderX, shoulderY);
        ctx.lineTo(handX, handY);
        ctx.stroke();

        ctx.strokeStyle = weaponColor;
        ctx.lineWidth = (stick === player && currentWeaponIndex === 0) ? 8 : 5;
        ctx.beginPath();
        ctx.moveTo(handX, handY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

      } else {
        const dir = stick.facingRight ? 1 : -1;
        let armOffset = Math.cos(stick.walkCycle) * 8;
        ctx.strokeStyle = stick.color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(shoulderX, shoulderY);
        ctx.lineTo(shoulderX - (14 + armOffset) * dir, shoulderY + 20);
        ctx.moveTo(shoulderX, shoulderY);
        ctx.lineTo(shoulderX + (14 - armOffset) * dir, shoulderY + 20);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawHP(x, y, hp, maxHp, color, label) {
      ctx.fillStyle = '#333';
      ctx.fillRect(x, y, 200, 20);

      ctx.fillRect(x, y, Math.max(0, (hp / maxHp) * 200), 20);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, 200, 20);

      ctx.fillStyle = "#fff";
      ctx.font = "14px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(label + " (" + Math.ceil(hp) + "/" + maxHp + " HP)", x, y - 5);
    }

    function drawCooldownBars(x, y) {

      ctx.font = '10px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(abilityCooldownTimer === 0 ? "✨ SKILL READY!" : "SKILL CHARGING...", x, y + 28);
    }

    function update() {
      if (isShopOpen || isAdminOpen) return;

      if (player.hp <= 0) {
        document.getElementById('btnRestart').style.display = 'block';
        return;
      }

      if (player.shieldTimer > 0) player.shieldTimer--;
      if (enemy.freezeTimer > 0) enemy.freezeTimer--;
      if (enemy.slowTimer > 0) enemy.slowTimer--;
      if (abilityCooldownTimer > 0) abilityCooldownTimer--;

      let currentWeapon = weaponList[currentWeaponIndex];
      if (currentWeapon.id === 4 && player.hp < player.maxHp) {
        regenTimer++;
        if (regenTimer >= 180) {
          player.hp = Math.min(player.maxHp, player.hp + 1);
          regenTimer = 0;
        }
      }

      player.vy += gravity;
      player.y += player.vy;
      if (player.y >= 280) {
        player.y = 280;
        player.vy = 0;
        player.isJumping = false;
      }

      enemy.vy += gravity;
      enemy.y += enemy.vy;
      if (enemy.y >= 280) {
        enemy.y = 280;
        enemy.vy = 0;
      }

      let moveSpeed = 5.9;
      if (currentWeapon.id === 2) moveSpeed = 6.9;
      if (currentWeapon.id === 9) moveSpeed = 7.9;

      let isPlayerMoving = false;
      if (moveLeft && player.x > 30) {
        player.x -= moveSpeed;
        player.facingRight = false;
        isPlayerMoving = true;
      }
      if (moveRight && player.x < canvas.width - 30) {
        player.x += moveSpeed;
        player.facingRight = true;
        isPlayerMoving = true;
      }

      if (isPlayerMoving && player.y === 280) {
        player.walkCycle += 0.25;
      } else {
        player.walkCycle = 0;
      }

      if (player.attackCooldown > 0) {
        player.attackCooldown--;
        if (player.attackCooldown === 0) player.attacking = false;
      }

      if (attackBuffer > 0) {
        attackBuffer--;
        if (player.attackCooldown === 0 && player.hp > 0 && enemy.hp > 0) {
          player.attacking = true;
          player.attackCooldown = player.maxCooldown;
          attackBuffer = 0;

          const distance = enemy.x - player.x;
          let hitConnected = false;

          if (player.facingRight && distance > 0 && distance < 85) {
            hitConnected = true;
          } else if (!player.facingRight && distance < 0 && distance > -85) {
            hitConnected = true;
          }

          if (hitConnected) {
            let dmg = currentWeapon.dmg;

            if (currentWeapon.id === 3 && Math.random() < 0.1) {
              dmg *= 2;
              hitsEffects.push({ x: enemy.x, y: enemy.y - 50, text: "CRITICAL! 💎", color: "#00d2ff", life: 20 });
            }

            if (currentWeapon.id === 5) enemy.slowTimer = 90;
            if (currentWeapon.id === 6) player.hp = Math.min(player.maxHp, player.hp + 2);

            let kbDist = (currentWeapon.id === 8) ? 65 : 22; 
            enemy.x += player.facingRight ? kbDist : -kbDist;
            enemy.x = Math.max(40, Math.min(760, enemy.x));

            dealEnemyDamage(dmg, "⚡ HIT");
          }
        }
      }

      for (let i = activeProjectiles.length - 1; i >= 0; i--) {
        let p = activeProjectiles[i];
        p.x += p.vx;
        if (Math.abs(p.x - enemy.x) < 30) {
          enemy.x += (p.vx > 0) ? 25 : -25;
          enemy.x = Math.max(40, Math.min(760, enemy.x));

          dealEnemyDamage(p.dmg, "🔥 FIREBALL");
          activeProjectiles.splice(i, 1);
        } else if (p.x < 0 || p.x > canvas.width) {
          activeProjectiles.splice(i, 1);
        }
      }

      if (player.hurtTimer > 0) player.hurtTimer--;
      if (enemy.hurtTimer > 0) enemy.hurtTimer--;

      enemy.facingRight = (player.x > enemy.x);

      let isEnemyMoving = false;
      if (enemy.freezeTimer === 0) {
        let currentEnemySpeed = (enemy.slowTimer > 0) ? enemy.speed * 0.5 : enemy.speed;

        if (enemy.x > player.x + 45) {
          enemy.x -= currentEnemySpeed;
          isEnemyMoving = true;
        } else if (enemy.x < player.x - 45) {
          enemy.x += currentEnemySpeed;
          isEnemyMoving = true;
        } else {
          if (enemy.attackCooldown === 0) {
            enemy.attacking = true;
            enemy.attackCooldown = enemy.maxCooldown;

            if (player.shieldTimer === 0) {
              let takenDmg = enemy.damage;
              if (currentWeapon.id === 1) takenDmg = Math.max(1, takenDmg - 1); 
              player.hp -= takenDmg;
              player.hurtTimer = 8;
              playHitSound();

              player.x += enemy.facingRight ? 16 : -16;
              player.x = Math.max(30, Math.min(canvas.width - 30, player.x));

              hitsEffects.push({ x: player.x, y: player.y - 30, text: "-" + takenDmg + " 💥", color: "#ff4757", life: 12 });
            } else {
              hitsEffects.push({ x: player.x, y: player.y - 30, text: "BLOCKED! 🛡️", color: "#00d2ff", life: 12 });
            }
          }
        }
      }

      if (isEnemyMoving && enemy.y === 280) {
        enemy.walkCycle += 0.25;
      } else {
        enemy.walkCycle = 0;
      }

      if (enemy.attackCooldown > 0) {
        enemy.attackCooldown--;
        if (enemy.attackCooldown === 0) enemy.attacking = false;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#444";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 330);
      ctx.lineTo(canvas.width, 330);
      ctx.stroke();

      drawHP(30, 30, player.hp, player.maxHp, '#00d2ff', 'PLAYER 🟦');
      drawCooldownBars(30, 55);
      
      drawHP(570, 30, enemy.hp, enemy.maxHp, '#ff4757', 'BOT (LVL ' + wave + ') 🟥');

      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 15px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("💰 COINS: $" + coins.toLocaleString() + (coins >= MAX_COINS ? " (MAX)" : ""), 30, 102);
      ctx.fillStyle = "#2ed573";
      ctx.fillText("WEAPON: " + weaponList[currentWeaponIndex].name + " (" + weaponList[currentWeaponIndex].mult.toFixed(1) + "x) | COIN MULT: " + coinMultLevel + "x 💸", 30, 120);
      ctx.fillStyle = "#a29bfe";
      ctx.fillText("ABILITY: " + abilityList[currentAbilityIndex].name, 30, 138);

      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 22px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("WAVE " + wave + " 🌊", canvas.width / 2, 40);

      drawStickman(player);
      drawStickman(enemy);

      activeProjectiles.forEach(p => {
        ctx.fillStyle = "#e17055";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fill();
      });

      if (specialVisualFx) {
        if (specialVisualFx.type === 'lightning') {
          ctx.strokeStyle = "#f1c40f";
          ctx.lineWidth = 12;
          ctx.beginPath();
          ctx.moveTo(specialVisualFx.targetX, 0);
          ctx.lineTo(specialVisualFx.targetX, 330);
          ctx.stroke();
        } else if (specialVisualFx.type === 'nuke') {
          ctx.fillStyle = "rgba(231, 76, 60, 0.4)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else if (specialVisualFx.type === 'beam') {
          ctx.fillStyle = "rgba(155, 89, 182, 0.7)";
          ctx.fillRect(0, 180, canvas.width, 100);
        }
        specialVisualFx.life--;
        if (specialVisualFx.life <= 0) specialVisualFx = null;
      }

      for (let i = hitsEffects.length - 1; i >= 0; i--) {
        let fx = hitsEffects[i];
        ctx.fillStyle = fx.color || "#ff4757";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(fx.text, fx.x, fx.y);
        if (!isShopOpen && !isAdminOpen) {
          fx.y -= 1.2;
          fx.life--;
        }
        if (fx.life <= 0) hitsEffects.splice(i, 1);
      }

      if (player.hp <= 0) {
        ctx.textAlign = "center";
        ctx.font = "bold 26px sans-serif";
        ctx.fillStyle = "#ff4757";
        ctx.fillText("GAME OVER! 💀 SURVIVED WAVE " + wave, canvas.width / 2, 170);
        ctx.fillStyle = "#ffd700";
        ctx.fillText("TOTAL CASH EARNED: $" + coins.toLocaleString() + " 💰", canvas.width / 2, 210);
      }
    }

    document.getElementById('btnRestart').addEventListener('pointerdown', () => {
      initAudio();
      wave = 1;
      recalculatePlayerStats();
      player.hp = player.maxHp;
      player.x = 150;
      player.y = 280;
      player.vy = 0;
      player.facingRight = true;
      player.shieldTimer = 0;
      spawnNextEnemy();
      document.getElementById('btnRestart').style.display = 'none';
    });

    recalculatePlayerStats();
    player.hp = player.maxHp;
    spawnNextEnemy();
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
  </script>
</body>
</html>
